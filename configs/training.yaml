# Training configuration for scripts/train.py
#
# Precedence: command-line flags > configs/training.yaml > FRAUD_* environment
# variables (read by fraud_ml.config.settings). Every field is optional; the
# values below document the defaults used in this workspace.
#
# The dataset is NEVER inferred from file presence. "demo" is synthetic data
# for UI/pipeline smoke tests only; "real" requires IEEE-CIS CSV/ZIP files in
# data_dir and fails loudly when they are absent.

data:
  mode: demo                # explicit: "demo" | "real"
  data_dir: data            # relative paths resolve from the repository root
  seed: 42
  sample_rows: null         # null = full dataset; integer = bounded smoke run

artifacts:
  dir: artifacts
  model_file: candidate.joblib
  metrics_file: metrics.json

# train_models() uses chronological partitions. These values are recorded for
# reproducibility and validated by fraud_ml.config.settings.
split:
  train_fraction: 0.70
  validation_fraction: 0.15
  method: chronological

validation:
  require_expected_columns: true
  pandera: false            # optional `validation` extra; built-in checks always run

threshold:
  strategy: max_f1          # max_f1 | min_precision | review_capacity | business_cost
  false_positive_cost: 50.0
  missed_fraud_cost: 500.0
  amount_at_risk_weight: 1.0
  investigation_capacity: null

calibration:
  method: isotonic          # isotonic | sigmoid | none; fit on validation only

tuning:
  enabled: true             # Optuna TPE search; falls back to bounded random search if absent
  backend: optuna
  trials: 12                # validation-only Objective; never touches the final test set
  study_name: fraud-lightgbm
  storage: sqlite:///optuna.db   # persistent study; remove for in-memory studies

experiment_tracking:
  enabled: true             # log_training_run() always records; MLflow used if installed
  backend: mlflow
  tracking_uri: sqlite:///mlflow.db  # MLflow 3 requires a database-backed store

registry:
  register: true            # candidate registration + validation gates (no auto-promotion)
  promote_automatically: false

notes:
  - "Joblib artifacts are executable serialization; load only trusted files."
  - "Calibrated scores are estimates; do not treat them as realized fraud loss."
  - "IEEE-CIS TransactionDT is relative elapsed time, not a calendar timestamp."
  - "No model is promoted automatically on a single metric; all gates must pass."
