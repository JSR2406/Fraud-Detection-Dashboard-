name: CI

on:
  push:
    branches: [main, fraud-platform-upgrade]
  pull_request:
    branches: [main, fraud-platform-upgrade]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Compile key Python files
        shell: bash
        run: |
          files=(app.py scripts/train.py scripts/serve.py scripts/monitor.py monitoring/__init__.py monitoring/drift.py)
          for pattern in 'api/*.py' 'fraud_ml/*.py' 'fraud_ml/*/*.py'; do
            for file in $pattern; do
              [ -f "$file" ] && files+=("$file")
            done
          done
          python -m py_compile "${files[@]}"

      - name: Check CLI entry points
        run: |
          python scripts/train.py --help
          python scripts/serve.py --help
          python scripts/monitor.py --help
