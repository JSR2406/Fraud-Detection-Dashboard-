[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-detection-platform"
version = "0.1.0"
description = "Fraud detection dashboard, ML pipeline, scoring API and monitoring scaffolding"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Janmejay Singh Rathore" }]
dependencies = [
    "streamlit>=1.32.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.1.0",
    "plotly>=5.18.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "joblib>=1.3.0",
    "imbalanced-learn>=0.11.0",
    "fastapi>=0.110.0,<1.0",
    "uvicorn>=0.27.0,<1.0",
    "httpx>=0.27.0,<1.0",
    "PyYAML>=6.0.1,<7.0",
    "optuna>=3.4.0,<4.0",
    "mlflow>=3.0,<4.0",
]

[project.optional-dependencies]
tuning = ["optuna>=3.4.0,<4.0"]
mlflow = ["mlflow>=2.10.0,<3.0"]
shap = ["shap>=0.45.0,<1.0"]
validation = ["pandera>=0.18.0,<1.0"]
dev = ["pytest>=8.0.0,<9.0", "ruff>=0.6.0", "PyYAML>=6.0.1,<7.0"]

[tool.setuptools.packages.find]
include = ["fraud_ml*", "monitoring*", "api*"]
namespaces = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", ".venv", "artifacts", "data", "__pycache__", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F"]
# E402: legacy entry points insert the repo root into sys.path before imports.
# E501: legacy modules contain intentionally dense one-line definitions.
ignore = ["E402", "E501"]
